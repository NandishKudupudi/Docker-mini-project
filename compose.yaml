
services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-web
    ports:
      - "8080:80"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
    volumes:
      - web-data:/data
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: nginx:alpine
    container_name: docker-backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  web-data:

networks:
  app-network:
    driver: bridge

